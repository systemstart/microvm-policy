name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
        with:
          determinate: false
          diagnostic-endpoint: ''
      # Proxy Go tests, egress-report, and the multi-node egress-integration
      # nixosTest (needs KVM, which the hosted runners provide).
      - run: nix flake check
