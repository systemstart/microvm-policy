name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
        with:
          determinate: false
          diagnostic-endpoint: ''
      - uses: cachix/cachix-action@v17
        with:
          name: systemstart
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          signingKey: ${{ secrets.CACHIX_SIGNING_KEY }}
      - run: nix develop --command make lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
        with:
          determinate: false
          diagnostic-endpoint: ''
      - uses: cachix/cachix-action@v17
        with:
          name: systemstart
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          signingKey: ${{ secrets.CACHIX_SIGNING_KEY }}
      - run: nix develop --command make test

  # Every flake check: the proxy package, the egress-report fixture test, and
  # the 4-node egress-integration nixosTest, which drives the real proxy across
  # VMs (the nix installer enables KVM on the hosted runners).
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
        with:
          determinate: false
          diagnostic-endpoint: ''
      - uses: cachix/cachix-action@v17
        with:
          name: systemstart
          # Pull only. What this job builds is test VMs, NixOS system closures
          # and test results — nothing a later build fetches — and pushing them
          # made the post step the longest part of the job. The reusable
          # outputs (Go toolchain, dev shell, egress-proxy) are pushed by the
          # lint and test jobs.
          skipPush: true
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          signingKey: ${{ secrets.CACHIX_SIGNING_KEY }}
      - run: nix flake check -L
      # ...but push the check RESULTS. Each nixosTest result is a small log
      # directory with no references, so this uploads only those, not the VMs
      # behind them. A later run with the same inputs — the release job's
      # check on the tag, a re-run — then substitutes every unchanged test
      # instead of booting all its VMs again (with nothing pushed, v0.3.0's
      # check ran every VM test from scratch: 20+ minutes).
      - name: Push the check results to Cachix
        if: github.event_name == 'push'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          CACHIX_SIGNING_KEY: ${{ secrets.CACHIX_SIGNING_KEY }}
        run: |
          nix eval --json .#checks.x86_64-linux --apply builtins.attrNames \
            | jq -r '.[] | ".#checks.x86_64-linux.\(.)"' \
            | xargs nix build --no-link --print-out-paths \
            | cachix push systemstart

  # `make release` only ever runs on a tag, so a broken cliff.toml would
  # surface *after* the tag is pushed -- leaving a tag with no release.
  # Exercise it on every push instead. This is deliberately not in `release`'s
  # `needs`: `make release` runs git-cliff itself and aborts before publishing
  # if it fails, so this is early warning, not a gate.
  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # git-cliff needs the full history and the tags
      - uses: DeterminateSystems/nix-installer-action@v23
        with:
          determinate: false
          diagnostic-endpoint: ''
      - uses: cachix/cachix-action@v17
        with:
          name: systemstart
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          signingKey: ${{ secrets.CACHIX_SIGNING_KEY }}
      # Renders the release notes for the latest tag. Catches a broken template
      # or an unparseable cliff.toml; prints them to the log so a reviewer can
      # see what a release would say.
      - run: nix develop --command make release-notes

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test, check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@v23
        with:
          determinate: false
          diagnostic-endpoint: ''
      - uses: cachix/cachix-action@v17
        with:
          name: systemstart
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          signingKey: ${{ secrets.CACHIX_SIGNING_KEY }}
      - run: nix develop --command make release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify the release page has notes
        # A release can publish with an empty body and still exit 0 (nix-oci
        # v0.5.0 shipped that way). Assert the page instead of trusting the
        # exit code.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          n=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body --jq '.body | length')
          echo "release body: $n characters"
          if [ "$n" -lt 200 ]; then
            echo "::error::release body is empty or truncated ($n chars) — the git-cliff notes did not reach the release page"
            exit 1
          fi
