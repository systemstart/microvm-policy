# Release notes, generated by git-cliff and published by `make release`.
#
# git-cliff parses each commit properly and exposes
# commit.breaking_description, so a BREAKING CHANGE footer reaches the release
# page -- a subject-only changelog could not carry it.
#
# This file owns the *whole* body: header, changelog and footer.
#
# `make release` renders this; `make release-notes` previews it without
# releasing anything.

[changelog]
header = """
Egress and filesystem containment for agent microVMs: default-deny egress
through a credential-holding host proxy, and a workspace the guest cannot
write through to the host.

## Use

```nix
inputs.microvm-policy.url = "github:systemstart/microvm-policy/<this tag>";
# nixosSystem modules:  microvm-policy.nixosModules.default
# launcher glue:        microvm-policy.packages.${system}.{egress-proxy,egress-report}
#                       ${microvm-policy}/allowlists/common.txt
```

See the [README](https://github.com/systemstart/microvm-policy#readme) for the
`microvmPolicy.*` options.

## Changelog
"""

# The `<!-- N -->` prefixes exist only to order the groups; striptags removes
# them from the rendered heading.
#
# raw_message, not message: git-cliff strips the conventional-commit type from
# `message`, which reads fine under "Features" but loses the build/ci/chore
# distinction under "Other changes". The subject is shown whole.
#
# `trim` is off below because it strips the leading indent that nests the
# Breaking line under its commit.
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {{ commit.raw_message | split(pat="\\n") | first | trim }}
{%- if commit.breaking and commit.breaking_description %}
  - **Breaking:** {{ commit.breaking_description | trim }}
{%- endif %}
{%- endfor %}
{% endfor %}
"""

footer = """

---

While the major version is 0, the `microvmPolicy.*` options, the proxy's JSON
config and audit-log format, and the `EGRESS_*`/`WORKSPACE_*` contract may
still change between minor releases; breaking changes are called out above.
"""

trim = false

[git]
conventional_commits = true
# Keep non-conventional commits rather than dropping them silently: an
# unlabelled commit still shipped, and a reader deserves to see it.
filter_unconventional = false
# A breaking commit is never filtered out by the parsers below.
protect_breaking_commits = true
filter_commits = false
topo_order = false
sort_commits = "oldest"

# First match wins, so the breaking rule has to come first: a `feat!:` belongs
# under Breaking changes, not Features. Type-based *skips* are deliberately
# few -- dropping whole types once emptied a changelog completely.
commit_parsers = [
  { message = "^Merge pull request", skip = true },
  { message = "^chore: release", skip = true },
  { message = "^.*!:", group = "<!-- 0 -->Breaking changes" },
  { message = "^feat", group = "<!-- 1 -->Features" },
  { message = "^fix", group = "<!-- 2 -->Fixes" },
  { message = ".*", group = "<!-- 3 -->Other changes" },
]

[bump]
# gsemver still computes the version (see `make release-tag`). If that ever
# moves to git-cliff, note the defaults differ: git-cliff bumps *major* on a
# breaking change even from 0.x, where gsemver bumps minor.
breaking_always_bump_major = false
features_always_bump_minor = true
